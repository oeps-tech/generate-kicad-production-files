name: Build and release Windows application

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set version
        shell: pwsh
        run: |
          $version = '0.1.1'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Only stable semantic-version tags can be released.' }
          }
          "OEPS_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build, verify, and package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:OEPS_VERSION
      - name: Upload reviewable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OEPS-Windows-${{ env.OEPS_VERSION }}
          path: |
            artifacts/*.msi
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: OEPS-Windows-*
          path: release-files
          merge-multiple: true
      - name: Publish tagged stable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem -LiteralPath release-files -File | ForEach-Object FullName
          $notes = "docs/releases/$($env:GITHUB_REF_NAME).md"
          if (Test-Path -LiteralPath $notes) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --title "OEPS KiCad Production Files $env:GITHUB_REF_NAME" --notes-file $notes @assets
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag --title "OEPS KiCad Production Files $env:GITHUB_REF_NAME" --generate-notes @assets
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
